<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="hline" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff2a6d"/>
      <stop offset="50%" stop-color="#05d9e8"/>
      <stop offset="100%" stop-color="#ff2a6d"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" fill="#05050f"/>

  <!-- Scanlines overlay -->
  <rect width="512" height="512" fill="url(#scan)" opacity="0.04"/>

  <!-- Border -->
  <rect x="12" y="12" width="488" height="488" fill="none" stroke="#05d9e8" stroke-width="2" opacity="0.3"/>

  <!-- Top gradient line -->
  <rect x="0" y="0" width="512" height="5" fill="url(#hline)"/>
  <!-- Bottom gradient line -->
  <rect x="0" y="507" width="512" height="5" fill="url(#hline)"/>

  <!-- Spy icon (simplified silhouette) -->
  <g filter="url(#glow)" opacity="0.15">
    <ellipse cx="256" cy="148" rx="52" ry="52" fill="#05d9e8"/>
    <path d="M148 380 Q148 290 256 290 Q364 290 364 380 Z" fill="#05d9e8"/>
  </g>

  <!-- UC letters -->
  <text x="256" y="310" text-anchor="middle"
        font-family="monospace, sans-serif"
        font-size="200" font-weight="900" letter-spacing="-8"
        fill="#05d9e8" filter="url(#glow)" opacity="0.95">UC</text>

  <!-- Subtitle -->
  <text x="256" y="380" text-anchor="middle"
        font-family="monospace, sans-serif"
        font-size="30" font-weight="700" letter-spacing="10"
        fill="#ff2a6d" opacity="0.85">UNDERCOVER</text>
</svg>
